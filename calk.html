<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Kuupäeva Kalkulaator</title>
    <script src="calkscr.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <ul>
        <li><button onclick="showCalculator('dateCalc')">Kuupäeva kalkulaator</button></li>
        <li><button onclick="showCalculator('summerCalc')">Suve alguse kalkulaator</button></li>
        <li><button onclick="showCalculator('newYearCalc')">Uue aasta kalkulaator</button></li>
        <li><button onclick="showCalculator('schoolYearCalc')">Õppeaasta lõpuni kalkulaator</button></li>
    </ul>
</nav>

<div id="dateCalc" class="calculator active">
    <h1>Kuupäeva kalkulaator</h1>
    <label for="dateA">Vali 1. kuupäev:</label>
    <input type="date" id="dateA">
    <br>
    <label for="dateB">Vali 2. kuupäev:</label>
    <input type="date" id="dateB">
    <br>
    <input type="button" value="OK" onclick="dateDiv()">
    <div id="answerD">Loading...</div>
</div>

<div id="summerCalc" class="calculator">
    <h1>Mitu päeva enne suve algust?</h1>
    <label for="tana">Mis päev täna on?:</label>
    <input type="date" id="tana">
    <br>
    <input type="button" value="OK" onclick="suveni()">
    <div id="answerS">Loading...</div>
</div>

<div id="newYearCalc" class="calculator">
    <h1>Mitu päeva uue aastani?</h1>
    <label for="tana1">Mis päev täna on?:</label>
    <input type="date" id="tana1">
    <br>
    <input type="button" value="OK" onclick="uusaasta()">
    <div id="answerB">Loading...</div>
</div>
</body>

<div id="schoolYearCalc" class="calculator">
    <h1>Mitu päeva õppeaasta lõpuni?</h1>
    <label for="todaySchool">Mis päev täna on?:</label>
    <input type="date" id="todaySchool">
    <br>
    <input type="button" value="OK" onclick="oppeaastaLopp()">
    <div id="answerSchool">Loading...</div>
</div>


</html>
